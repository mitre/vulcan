parameters:
  - $ref: ../components/parameters/ComponentId.yaml
get:
  operationId: getRulesPicker
  tags:
    - Rules
  summary: Lightweight rule list for picker UI
  description: >-
    Returns a compact list of requirements for dropdown/picker selection
    (e.g., the move-to-rule admin action or duplicate-of picker). Lighter
    than the full rules list — omits content fields. Rows are shaped by the
    component's document_type: STIG rule objects carry the satisfaction
    relationships, authored SRG requirement objects omit them entirely.
    Requires project membership.
  responses:
    '200':
      description: Requirements for picker selection
      content:
        application/json:
          schema:
            type: object
            required:
              - rules
            properties:
              rules:
                type: array
                description: >-
                  All requirements in picker shape, one variant per
                  document kind — the shapes are disjoint and never
                  collapse into one list.
                items:
                  oneOf:
                    - $ref: ../components/schemas/RulePickerResponse.yaml
                    - $ref: ../components/schemas/AuthoredSrgRulePickerResponse.yaml
          examples:
            stig_picker:
              summary: STIG rules for dropdown
              value:
                rules:
                  - id: 100
                    rule_id: "000050"
                    displayed_name: "CNTR-00-000050"
                    title: "Container images must be signed"
                    locked: false
                    satisfies: []
                    satisfied_by: []
                  - id: 101
                    rule_id: "000051"
                    displayed_name: "CNTR-00-000051"
                    title: "Container images must come from approved registries"
                    locked: true
                    satisfies: []
                    satisfied_by: []
            srg_picker:
              summary: Authored SRG requirements for dropdown
              value:
                rules:
                  - id: 10633
                    rule_id: "000001"
                    displayed_name: "RCPK-00-000001"
                    title: "The container platform must enforce approved authorizations"
                    status: "Applicable"
                    locked: false
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

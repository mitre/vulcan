get:
  operationId: latestComponents
  tags:
    - Benchmarks
  summary: List the latest released component per family
  description: >-
    Returns one released component per prefix family — the numerically
    highest version/release pair — for dropdown population. A component is
    a STIG in progress; released ones are instance-wide reference data for
    any authenticated user. Unreleased drafts never appear. The q parameter
    filters families by case-insensitive substring with abbreviation
    expansion (RHEL matches Red Hat Enterprise Linux); queries shorter than
    2 characters return no rows.
  parameters:
    - name: q
      in: query
      required: false
      description: >-
        Family filter — case-insensitive substring matched against name,
        prefix, and title, with abbreviation expansion (minimum 2 characters).
      schema:
        type: string
      example: RHEL-09
  responses:
    '200':
      description: Latest released component per family, ordered by prefix
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ComponentLatestResponse.yaml
          examples:
            latest:
              summary: Latest released components
              value:
                rows:
                  - id: 38
                    prefix: RHEL-09
                    name: RHEL 9 Hardened Baseline
                    title: Red Hat Enterprise Linux 9
                    version: 2
                    release: 1
    '401':
      $ref: ../components/responses/Unauthorized.yaml

get:
  operationId: listRequirementRelocations
  tags:
    - Rules
  summary: List the open relocation-proposal backlog
  description: >-
    Returns relocation proposals, optionally filtered to one destination
    SRG's abbreviation — the standing per-SRG backlog and the
    creation/open-time prompt count both read this. Rows are scoped to
    projects the caller can see. Executed records are immutable history
    and never listed.
  parameters:
    - name: target_technology_token
      in: query
      required: false
      description: The destination SRG's abbreviation to filter by.
      schema:
        type: string
      example: CTR
  responses:
    '200':
      description: Open proposals (and retained declines), oldest first
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/RequirementRelocationSummary.yaml
          examples:
            backlog:
              summary: One open proposal for the CTR SRG
              value:
                - id: 12
                  source_rule_id: 5137
                  target_technology_token: CTR
                  created_at: "2026-07-20 15:36:06 UTC"
                  source_displayed_name: CNTR-00-000051
                  component_id: 42
                  component_name: Container Platform SRG
                  requested_by_name: Jane Doe
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

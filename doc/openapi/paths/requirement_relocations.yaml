get:
  operationId: listRequirementRelocations
  tags:
    - Rules
  summary: List the pending relocation backlog
  description: >-
    Returns pending relocation markers, optionally filtered to one
    destination family's technology token — the standing per-family
    backlog and the creation/open-time prompt count both read this.
    Rows are scoped to projects the caller can see. Executed records
    are immutable history and never listed.
  parameters:
    - name: target_technology_token
      in: query
      required: false
      description: Destination family technology token to filter by.
      schema:
        type: string
      example: CTR
  responses:
    '200':
      description: Pending markers, oldest first
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/RequirementRelocationSummary.yaml
          examples:
            backlog:
              summary: One pending marker for the CTR family
              value:
                - id: 12
                  source_rule_id: 5137
                  target_technology_token: CTR
                  created_at: "2026-07-20 15:36:06 UTC"
                  source_displayed_name: CNTR-00-000051
                  component_id: 42
                  component_name: Container Platform SRG
                  requested_by_name: Jane Doe
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

get:
  operationId: listProjects
  tags:
    - Projects
  summary: List accessible projects
  description: >-
    Returns all projects the current user can access, including owned projects,
    member projects, and discoverable projects. Includes membership counts and
    pending comment counts per project. Requires authentication.
  responses:
    '200':
      description: Projects list
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/ProjectIndexResponse.yaml
          examples:
            projects:
              summary: Two accessible projects
              value:
                - id: 4
                  name: Container Platform
                  memberships_count: 14
                - id: 1
                  name: Photon 3
                  memberships_count: 14
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml
post:
  operationId: createProject
  tags:
    - Projects
  summary: Create a new project
  description: >-
    Creates a new project with the given name and description. The creating
    user is automatically added as an admin member. Requires authentication.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            project:
              description: >-
                The shared project input surface plus the create-only
                slack_channel_id convenience field, which merges into the
                metadata data hash as "Slack Channel ID" and wins over a
                same-key entry supplied in project_metadata_attributes.
              allOf:
                - $ref: ../components/schemas/ProjectInput.yaml
                - type: object
                  properties:
                    slack_channel_id:
                      type: string
                      description: >-
                        Convenience field — stored as the metadata key
                        "Slack Channel ID". Accepted at creation only; use
                        project_metadata_attributes on update.
                      example: C0123456789
        examples:
          create:
            summary: Create a new project
            value:
              project:
                name: Red Hat Enterprise Linux 9
                description: STIG development for RHEL 9
          create_with_metadata:
            summary: Create with metadata in the same call
            value:
              project:
                name: Red Hat Enterprise Linux 9
                description: STIG development for RHEL 9
                visibility: discoverable
                project_metadata_attributes:
                  data:
                    POC Name: Jane Doe
                    POC Email: jane@example.com
  responses:
    '200':
      description: Project created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProjectCreateResponse.yaml
          examples:
            created:
              summary: Project created
              value:
                toast:
                  title: Project created.
                  message:
                    - "Successfully created project Red Hat Enterprise Linux 9."
                  variant: success
                redirect_url: /projects/5
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

post:
  operationId: requestPasswordReset
  tags:
    - Auth
  security: []
  summary: Request password reset instructions
  description: >-
    Sends a password reset email to the given address. In paranoid mode
    (default), always returns success — even if the email is not registered —
    to prevent email enumeration. Blank email returns 422.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - user
          properties:
            user:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the account to reset.
                  example: jane@example.com
        examples:
          reset_request:
            summary: Request password reset
            value:
              user:
                email: jane@example.com
  responses:
    '200':
      description: Instructions sent (or paranoid success)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ToastResponse.yaml
          examples:
            sent:
              summary: Reset instructions sent
              value:
                toast:
                  title: Instructions sent.
                  message:
                    - >-
                      If your email address exists in our database, you will
                      receive a password recovery link at your email address
                      in a few minutes.
                  variant: success
    '422':
      description: Validation error (blank email)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ToastResponse.yaml
          examples:
            blank_email:
              summary: Email is blank
              value:
                toast:
                  title: Could not send instructions.
                  message:
                    - Email can't be blank
                  variant: danger
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml
put:
  operationId: executePasswordReset
  tags:
    - Auth
  security: []
  summary: Reset password using token from email
  description: >-
    Resets the user's password using the token from the reset email.
    On success, signs the user in and returns a success toast. On failure
    (invalid token, mismatched passwords, complexity violation), returns
    422 with error details.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - user
          properties:
            user:
              type: object
              required:
                - reset_password_token
                - password
                - password_confirmation
              properties:
                reset_password_token:
                  type: string
                  description: Token from the password reset email link.
                  example: abc123def456
                password:
                  type: string
                  format: password
                  description: New password (must meet complexity requirements).
                  example: "N3wS3cure!#Pass"
                password_confirmation:
                  type: string
                  format: password
                  description: Must match the new password.
                  example: "N3wS3cure!#Pass"
        examples:
          reset:
            summary: Reset with valid token
            value:
              user:
                reset_password_token: abc123def456
                password: "N3wS3cure!#Pass"
                password_confirmation: "N3wS3cure!#Pass"
  responses:
    '200':
      description: Password reset successfully — user signed in
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ToastResponse.yaml
          examples:
            reset:
              summary: Successful password reset
              value:
                toast:
                  title: Password reset.
                  message:
                    - >-
                      Your password has been changed successfully. You are
                      now signed in.
                  variant: success
    '422':
      description: Invalid token, expired token, or password validation failure
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ToastResponse.yaml
          examples:
            invalid_token:
              summary: Bad reset token
              value:
                toast:
                  title: Could not reset password.
                  message:
                    - Reset password token is invalid
                  variant: danger
            complexity:
              summary: Password complexity failure
              value:
                toast:
                  title: Could not reset password.
                  message:
                    - Password must include at least 2 numbers
                  variant: danger
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

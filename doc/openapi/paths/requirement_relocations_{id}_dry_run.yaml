parameters:
  - name: id
    in: path
    required: true
    description: Numeric ID of the open relocation proposal.
    schema:
      type: integer
    example: 12
post:
  operationId: dryRunRequirementRelocation
  tags:
    - Rules
  summary: Preview accepting a relocation with zero writes
  description: >-
    Returns exactly what accepting the proposal would do for this
    destination component — or every reason it cannot run — without
    writing anything. This preview is the adjudication review artifact.
    Requires author role on the DESTINATION component only. Adjudicated
    proposals (declined or executed) answer 404 like a record that never
    existed.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - target_component_id
          properties:
            target_component_id:
              type: integer
              description: The destination SRG component.
              example: 42
        examples:
          preview:
            summary: Preview a move into component 42
            value:
              target_component_id: 42
  responses:
    '200':
      description: The preview, valid or not
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RequirementRelocationDryRun.yaml
          examples:
            valid:
              summary: Move can run
              value:
                valid: true
                errors: []
                source_displayed_name: CNTR-00-000051
                target_component_id: 42
                target_component_name: Container Platform SRG
                would_create:
                  title: The application must enforce approved authorizations
                  status: Applicable
                  derived_from_srg_rule_id: 5137
                would_tombstone_source: true
    '404':
      $ref: ../components/responses/NotFound.yaml
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

parameters:
  - $ref: ../components/parameters/ReviewId.yaml
patch:
  operationId: triageReview
  tags:
    - Reviews
  summary: Set triage status on a comment (concur, non_concur, etc.)
  description: >-
    Assigns a triage decision to the comment. Parameters are FLAT (no
    wrapper object). Terminal statuses (duplicate, informational,
    withdrawn, addressed_by) auto-adjudicate. Submitting "pending" is
    rejected — it is the initial state, not a decision. Conditional
    requirements: non_concur requires response_comment; duplicate requires
    duplicate_of_review_id; addressed_by requires addressed_by_rule_id.
    Requires author or admin role.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - triage_status
          properties:
            triage_status:
              type: string
              description: >-
                The triage decision. Every value except "pending" is
                accepted; "pending" is rejected as a non-decision.
              enum:
                - concur
                - concur_with_comment
                - non_concur
                - needs_clarification
                - duplicate
                - informational
                - withdrawn
                - addressed_by
              example: concur
            duplicate_of_review_id:
              type: integer
              description: >-
                REQUIRED when triage_status is "duplicate" — the canonical
                review this comment duplicates.
              example: 42
            addressed_by_rule_id:
              type: integer
              description: >-
                REQUIRED when triage_status is "addressed_by" — the rule
                that addresses this comment.
              example: 7
            response_comment:
              type: string
              description: >-
                REQUIRED when triage_status is "non_concur"; optional
                otherwise. Posted as a reply to the comment.
              example: Declining — the requirement text already covers this.
        examples:
          concur:
            summary: Simple concur (flat body)
            value:
              triage_status: concur
          non_concur:
            summary: Decline with the required response
            value:
              triage_status: non_concur
              response_comment: Declining — covered by the fix text.
  responses:
    '200':
      description: Triage status set
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TriageResponse.yaml
      links:
        AdjudicateTriagedReview:
          operationId: adjudicateReview
          parameters:
            reviewId: '$response.body#/review/id'
          description: Close the review after triage is complete.
        ReopenTriagedReview:
          operationId: reopenReview
          parameters:
            reviewId: '$response.body#/review/id'
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

get:
  operationId: listPersonalAccessTokens
  tags:
    - Personal Access Tokens
  summary: List current user's API tokens
  description: >-
    Returns all personal access tokens for the authenticated user, ordered
    by creation date (newest first). Admins can pass user_id to list another
    user's tokens. Token digests are never exposed. Session auth only —
    token-authenticated requests receive 403.
  security:
    - cookieAuth: []
  parameters:
    - name: user_id
      in: query
      required: false
      description: Admin-only. List tokens for this user instead of the current user.
      schema:
        type: integer
      example: 42
  responses:
    '200':
      description: Token list
      content:
        application/json:
          schema:
            type: object
            required:
              - personal_access_tokens
            additionalProperties: false
            properties:
              personal_access_tokens:
                type: array
                items:
                  description: >-
                    Shaped by the caller: the owner's own tokens, or — when an
                    administrator passes user_id — that user's tokens with the
                    owner identity attached.
                  oneOf:
                    - $ref: ../components/schemas/PersonalAccessTokenSummary.yaml
                    - $ref: ../components/schemas/PersonalAccessTokenAdminSummary.yaml
          examples:
            with_tokens:
              summary: User has two active tokens
              value:
                personal_access_tokens:
                  - id: 1
                    name: CI Pipeline
                    token_prefix: vulcan_a
                    scopes: [read, write]
                    expires_at: '2026-08-30'
                    last_used_at: '2026-05-30 14:22:01 UTC'
                    revoked_at: null
                    allowed_ips: null
                    created_at: '2026-05-30 10:00:00 UTC'
    '403':
      description: Token-authenticated request rejected — token management requires a session (RFC 9457 problem details)
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: false
            required:
              - type
              - title
              - status
              - detail
            properties:
              type:
                type: string
                description: Stable machine identifier for the error class.
                example: /docs/api/errors#session_authentication_required
              title:
                type: string
                description: Short human summary of the error class.
                example: Session authentication required
              status:
                type: integer
                description: HTTP status code, repeated in the body.
                example: 403
              detail:
                type: string
                description: Occurrence-specific human explanation.
                example: >-
                  Token management requires a signed-in browser session; API
                  tokens cannot create or revoke tokens.
          examples:
            session_required:
              summary: API token used against token management
              value:
                type: /docs/api/errors#session_authentication_required
                title: Session authentication required
                status: 403
                detail: >-
                  Token management requires a signed-in browser session; API
                  tokens cannot create or revoke tokens.
    '404':
      $ref: ../components/responses/NotFound.yaml
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml
post:
  operationId: createPersonalAccessToken
  tags:
    - Personal Access Tokens
  summary: Create a new API token
  description: >-
    Creates a personal access token ON THE SIGNED-IN ACCOUNT. The raw token is
    returned ONCE in the response — it is never stored or retrievable after
    this. Requires current password for session hijack protection. Session auth
    only. Max 20 active tokens per user, max 365-day lifetime.
    Ownership can never be redirected: a token authenticates AS its owner, so
    no caller — administrators included — may mint one on another user's
    account, and any user_id supplied in the body is ignored. Administrators
    oversee other users' tokens by listing (GET with user_id) and revoking
    them; account recovery goes through a password reset, where the user
    re-authenticates.
  security:
    - cookieAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - personal_access_token
          properties:
            personal_access_token:
              type: object
              required:
                - name
                - scopes
                - current_password
              properties:
                name:
                  type: string
                  example: CI Pipeline
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [read, write, admin]
                  example: [read, write]
                expires_at:
                  type: string
                  format: date
                  example: '2026-08-30'
                allowed_ips:
                  type: array
                  items:
                    type: string
                  example: ['10.0.0.0/8']
                current_password:
                  type: string
                  description: Required for session hijack protection.
  responses:
    '201':
      description: Token created — raw token shown once
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PersonalAccessTokenCreateResponse.yaml
      links:
        RevokeCreatedToken:
          operationId: revokePersonalAccessToken
          parameters:
            tokenId: '$response.body#/personal_access_token/id'
          description: Revoke the newly created token.
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '422':
      description: >-
        Validation failed. Toast JSON for domain validation (invalid scopes,
        max tokens reached, etc.); RFC 9457 problem details when the current
        password re-verification fails — token creation re-verifies the
        signed-in user's password before minting a credential, and 422 (not
        401) says the authenticated caller's input was wrong.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ToastResponse.yaml
        application/problem+json:
          schema:
            type: object
            additionalProperties: false
            required:
              - type
              - title
              - status
              - detail
            properties:
              type:
                type: string
                description: Stable machine identifier for the error class.
                example: /docs/api/errors#incorrect_password
              title:
                type: string
                description: Short human summary of the error class.
                example: Incorrect password
              status:
                type: integer
                description: HTTP status code, repeated in the body.
                example: 422
              detail:
                type: string
                description: Occurrence-specific human explanation.
                example: >-
                  Creating or managing API tokens re-verifies your identity,
                  and the current password provided does not match.
          examples:
            incorrect_password:
              summary: Password re-verification failed
              value:
                type: /docs/api/errors#incorrect_password
                title: Incorrect password
                status: 422
                detail: >-
                  Creating or managing API tokens re-verifies your identity,
                  and the current password provided does not match.
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

get:
  operationId: componentTriageSummary
  tags:
    - Components
  summary: Get triage summary for a component
  description: >-
    Returns top-level comment counts per triage status plus the
    adjudication percentage — rule-attached and component-attached
    comments both count. Access matches the component show rules: released
    components are readable by any authenticated user; unreleased ones
    require viewer permission.
  parameters:
    - name: id
      in: path
      required: true
      description: Numeric ID of the component.
      schema:
        type: integer
      example: 38
  responses:
    '200':
      description: Component triage summary
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TriageSummaryResponse.yaml
          examples:
            summary:
              summary: Component with comments in triage
              value:
                by_triage_status:
                  pending: 3
                  concur: 1
                  concur_with_comment: 0
                  non_concur: 0
                  duplicate: 0
                  informational: 1
                  needs_clarification: 0
                  withdrawn: 0
                  addressed_by: 0
                total: 5
                adjudicated: 1
                adjudication_pct: 20.0
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml

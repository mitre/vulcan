parameters:
  - $ref: ../components/parameters/RuleId.yaml
patch:
  operationId: bulkSectionLocks
  tags:
    - Rules
  summary: Bulk update locked sections
  description: >-
    Locks or unlocks multiple sections at once on a rule. Requires reviewer
    role or higher on the parent component. Creates an audit trail entry.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - sections
            - locked
          properties:
            sections:
              type: array
              description: Section names to lock or unlock, from the lockable-section vocabulary.
              items:
                type: string
                enum:
                  - Title
                  - Severity
                  - Status
                  - Fix
                  - Check
                  - Vulnerability Discussion
                  - DISA Metadata
                  - Vendor Comments
                  - Artifact Description
                  - XCCDF Metadata
              example:
                - Fix
                - Check
            locked:
              type: boolean
              description: Whether to lock (true) or unlock (false) the sections.
              example: true
            comment:
              type: string
              description: Optional audit comment explaining the lock change.
              example: "Locking the Fix and Check sections for review"
  responses:
    '200':
      description: Section locks updated, returns updated rule + toast
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RuleSectionLockResponse.yaml
    '422':
      description: Invalid section names
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
                description: Names every unrecognized section.
                example: "Invalid sections: NotASection"
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

get:
  operationId: validateResetToken
  tags:
    - Auth
  security: []
  summary: Validate a password reset token
  description: >-
    Checks whether a password reset token is valid and not expired.
    The SPA calls this when the user follows the reset link to determine
    whether to show the reset form or an error message. Returns the
    minimum password length for client-side validation.
  parameters:
    - name: reset_password_token
      in: query
      required: true
      description: The raw reset token from the email link.
      schema:
        type: string
      example: abc123def456
  responses:
    '200':
      description: Token is valid
      content:
        application/json:
          schema:
            type: object
            required:
              - valid
              - minimum_password_length
            properties:
              valid:
                type: boolean
                description: Whether the token is valid and not expired.
                example: true
              minimum_password_length:
                type: integer
                description: Minimum password length for client-side validation.
                example: 15
          examples:
            valid:
              summary: Valid token
              value:
                valid: true
                minimum_password_length: 15
    '422':
      description: Token is invalid, expired, or missing
      content:
        application/json:
          schema:
            type: object
            required:
              - valid
              - error
            properties:
              valid:
                type: boolean
                description: Always false for error responses.
                example: false
              error:
                type: string
                description: Human-readable error message.
                example: Reset token is invalid or has expired.
          examples:
            invalid:
              summary: Invalid token
              value:
                valid: false
                error: Reset token is invalid or has expired.
            missing:
              summary: No token provided
              value:
                valid: false
                error: No reset token provided.
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

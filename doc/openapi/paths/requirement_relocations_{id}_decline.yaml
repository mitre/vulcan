parameters:
  - name: id
    in: path
    required: true
    description: Numeric ID of the open relocation proposal.
    schema:
      type: integer
    example: 12
post:
  operationId: declineRequirementRelocation
  tags:
    - Rules
  summary: Non-concur with a relocation proposal, with a rationale
  description: >-
    Receiver-side adjudication (displayed as Non-concur): declines the
    proposal with a REQUIRED rationale. The record is retained as
    terminal history — never destroyed — and the rationale surfaces to
    the source author in the backlog, so the refusal communicates back
    across the ownership boundary. Requires author role on the
    destination component named in the request, and that component must
    be an ELIGIBLE receiver — an unreleased SRG component, other than
    the source, that declares the source requirement's core SRG (the
    same eligibility accept enforces). Audited. A declined source may be
    proposed again.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - target_component_id
            - requirement_relocation
          properties:
            target_component_id:
              type: integer
              description: >-
                The destination component the decliner adjudicates for —
                establishes receiver-side authority.
              example: 42
            requirement_relocation:
              type: object
              required:
                - adjudication_rationale
              properties:
                adjudication_rationale:
                  type: string
                  description: Why the proposal is declined — shown to the source author.
                  example: Covered by CNTR-00-000001 already.
        examples:
          decline:
            summary: Decline with the reason
            value:
              target_component_id: 42
              requirement_relocation:
                adjudication_rationale: Covered by CNTR-00-000001 already.
  responses:
    '200':
      description: Proposal non-concurred with and retained with the rationale
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ToastResponse.yaml
          examples:
            declined:
              summary: Non-concur recorded
              value:
                toast:
                  title: Non-concurred.
                  message:
                    - The source author can see your rationale in the backlog.
                  variant: success
    '422':
      description: The rationale is missing, or the named component is not an eligible receiver
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ToastResponse.yaml
          examples:
            missing_rationale:
              summary: Rationale required
              value:
                toast:
                  title: Could not decline the proposal.
                  message:
                    - Adjudication rationale can't be blank
                  variant: danger
            ineligible_receiver:
              summary: Anchored to an ineligible component
              value:
                toast:
                  title: Could not decline the proposal.
                  message:
                    - target component must be an SRG component
                  variant: danger
    '404':
      $ref: ../components/responses/NotFound.yaml
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

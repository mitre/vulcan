parameters:
  - $ref: ../components/parameters/ComponentId.yaml
get:
  operationId: listComponentRules
  tags:
    - Rules
  summary: List all rules for a component
  description: >-
    Returns all rules in the component with full content fields (title, fixtext,
    check_content, vuln_discussion, etc.). Used by the component editor to
    populate the rule list. Requires project membership.
  responses:
    '200':
      description: All component rules
      content:
        application/json:
          schema:
            type: array
            description: >-
              Items are shaped by the component's document_type: STIG rules
              or authored SRG requirements.
            items:
              oneOf:
                - $ref: ../components/schemas/RuleEditorResponse.yaml
                - $ref: ../components/schemas/AuthoredSrgRuleEditorResponse.yaml
          examples:
            rules:
              summary: Two rules
              value:
                - id: 100
                  rule_id: "CNTR-00-000050"
                  title: "Container images must be signed"
                  status: "Applicable - Configurable"
                  locked: false
                  satisfies: []
                  satisfied_by: []
                - id: 101
                  rule_id: "CNTR-00-000051"
                  title: "Container images must come from approved registries"
                  status: "Applicable - Configurable"
                  locked: false
                  satisfies: []
                  satisfied_by: []
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml
post:
  operationId: createRule
  tags:
    - Rules
  summary: Create a new rule in a component
  description: >-
    Creates a rule row — either a blank rule (content is then edited via
    the rule update endpoint) or a duplicate of an existing rule in the
    component. Rule IDs are assigned from the component's prefix pattern.
    Requires author role or higher on the parent project. Rejected with
    422 on SRG-kind components (authored requirements come from source
    SRGs, not manual creation).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            rule:
              type: object
              description: >-
                Creation mode only — content fields are not accepted here;
                edit the created rule to set content.
              properties:
                duplicate:
                  type: boolean
                  description: Duplicate an existing rule instead of creating a blank one.
                  example: false
                id:
                  type: integer
                  description: Source rule id to duplicate (required when duplicate is true).
                  example: 100
        examples:
          create:
            summary: Create a blank rule
            value:
              rule:
                duplicate: false
          duplicate:
            summary: Duplicate an existing rule
            value:
              rule:
                duplicate: true
                id: 100
  responses:
    '200':
      description: Rule created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RuleCreateResponse.yaml
          examples:
            created:
              summary: Control created
              value:
                toast:
                  title: Control created.
                  message:
                    - Successfully created control.
                  variant: success
                data:
                  id: 5000
                  rule_id: "000204"
                  title: "New container security requirement"
                  status: "Not Yet Determined"
                  locked: false
                  satisfies: []
                  satisfied_by: []
      links:
        GetCreatedRule:
          operationId: getRule
          parameters:
            ruleId: '$response.body#/data/id'
          description: Fetch the newly created rule.
        UpdateCreatedRule:
          operationId: updateRule
          parameters:
            ruleId: '$response.body#/data/id'
          description: Update the newly created rule.
        DeleteCreatedRule:
          operationId: deleteRule
          parameters:
            ruleId: '$response.body#/data/id'
          description: Delete the newly created rule.
    4XX:
      $ref: ../components/responses/ErrorResponse.yaml

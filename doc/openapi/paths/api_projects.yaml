get:
  operationId: listApiProjects
  tags:
    - Projects
  summary: List projects with pagination, search, and sorting
  description: >-
    Paginated project listing for SPA consumption. Supports substring search
    over name and description, whitelist-validated sorting, and pagy-backed
    pagination (default 25 per page, maximum 100). Unknown sort fields are
    silently ignored. Requires authentication. Returns 400 when the requested
    page is out of range. Timestamps on this endpoint are ISO 8601
    (render_as_json path), unlike the string-rendered project pages.
  parameters:
    - name: q
      in: query
      required: false
      description: >-
        Case-insensitive substring filter matched against project name and
        description.
      schema:
        type: string
      example: Photon
    - name: sort
      in: query
      required: false
      description: Sort field. Unknown fields are silently ignored.
      schema:
        type: string
        enum:
          - name
          - created_at
          - updated_at
      example: name
    - name: order
      in: query
      required: false
      description: Sort direction. Defaults to asc when sort is applied.
      schema:
        type: string
        enum:
          - asc
          - desc
      example: asc
    - name: page
      in: query
      required: false
      description: Page number (1-based). Out-of-range pages return 400.
      schema:
        type: integer
      example: 1
    - name: per_page
      in: query
      required: false
      description: Records per page (default 25, capped at 100).
      schema:
        type: integer
      example: 25
  responses:
    '200':
      description: Paginated project rows
      content:
        application/json:
          schema:
            type: object
            required:
              - rows
              - pagination
            additionalProperties: false
            properties:
              rows:
                type: array
                description: Projects on the current page.
                items:
                  $ref: ../components/schemas/ProjectSummary.yaml
              pagination:
                $ref: ../components/schemas/PaginationMeta.yaml
          examples:
            first_page:
              summary: First page of projects
              value:
                rows:
                  - id: 34
                    name: Photon 3
                    description: null
                    visibility: discoverable
                    memberships_count: 2
                    admin_name: Demo Admin
                    admin_email: admin@example.org
                    created_at: "2026-05-30T14:06:03.797Z"
                    updated_at: "2026-05-30T14:06:28.292Z"
                pagination:
                  page: 1
                  per_page: 25
                  total: 1
    '400':
      description: Requested page is out of range
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            additionalProperties: false
            properties:
              error:
                type: string
                description: Error message naming the valid page range.
                example: Page 9999 is out of range (1..2)
    '401':
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            additionalProperties: false
            properties:
              error:
                type: string
                description: Error message.
                example: Unauthorized

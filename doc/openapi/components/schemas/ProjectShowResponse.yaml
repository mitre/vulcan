description: >-
  Full project detail for the project show page. Serialized by ProjectBlueprint :show view.
  18 total fields including nested components, memberships, users, access_requests.
allOf:
  - $ref: ./ProjectSummary.yaml
  - type: object
    properties:
      effective_permissions:
        type:
          - string
          - 'null'
        description: >-
          Current user's role on this project (admin, reviewer, author, viewer).
          Null when the user is not a member. System admins always get 'admin'.
        enum:
          - admin
          - reviewer
          - author
          - viewer
          - null
        example: admin
      pending_comment_count:
        type: integer
        description: Aggregate pending comment count across all components.
        example: 1
      details:
        description: >-
          Project-wide requirement statistics. Per-document-type sections
          (stig with the five DISA buckets, srg with the three SRG buckets)
          never collapse into each other; total, lock, and review-state
          numbers are type-agnostic and span every kind. The flat
          ac/aim/adnm/na/nyd keys mirror the stig section and are
          deprecated in favor of the typed sections.
        oneOf:
          - $ref: ./ProjectDetails.yaml
          - type: 'null'
      histories:
        type: array
        description: Recent audit trail entries (last 50).
        items:
          type: object
      metadata:
        type:
          - object
          - 'null'
        description: Project metadata key-value pairs.
        example: null
      memberships:
        type: array
        description: Project members with roles.
        items:
          $ref: ./MembershipSummary.yaml
      components:
        type: array
        description: Components in this project (ComponentBlueprint :index view).
        items:
          $ref: ./ComponentIndexResponse.yaml
      available_components:
        type: array
        description: Components available to add (from other projects the user can access).
        items:
          $ref: ./ComponentIndexResponse.yaml
      users:
        type: array
        description: All users associated with this project.
        items:
          type: object
          properties:
            id:
              type: integer
            name:
              type:
                - string
                - 'null'
            email:
              type: string
              format: email
      access_requests:
        type: array
        description: Pending access requests from non-member users.
        items:
          type: object
          properties:
            id:
              type: integer
              description: Access request ID.
            user:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type:
                    - string
                    - 'null'
                email:
                  type: string
                  format: email
            project_id:
              type: integer

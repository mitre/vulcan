description: Input fields for creating or updating a component within a project.
type: object
required:
  - name
  - prefix
  - title
  - security_requirements_guide_id
properties:
  security_requirements_guide_id:
    type: integer
    description: >-
      The catalog SRG the component is based on — the requirement source
      for STIG-kind imports and the declared source document for
      SRG-kind authoring.
    example: 1
  name:
    type: string
    description: Human-readable component name.
    example: Container SRG
  prefix:
    type: string
    description: Short alphanumeric prefix used to construct rule IDs (e.g. CNTR in CNTR-00-000050).
    example: CNTR
  document_type:
    type: string
    description: >-
      Authoring profile for the new component: stig authors STIG
      requirements from a source SRG; srg authors SRG requirements.
      Defaults to stig; immutable after creation.
    enum:
      - stig
      - srg
    example: stig
  version:
    type: integer
    description: Version number of the component.
    example: 1
  release:
    type: integer
    description: Release number of the component.
    example: 1
  title:
    type: string
    description: Full official title of the component.
    example: Container Platform Security Technical Implementation Guide
  description:
    type: string
    description: Optional longer description of the component scope and purpose.
    example: STIG guidance for container orchestration platform deployments.

description: Input fields for creating or updating a component within a project.
type: object
required:
  - name
  - prefix
  - title
  - security_requirements_guide_id
properties:
  security_requirements_guide_id:
    type: integer
    description: >-
      The PRIMARY source SRG (based_on). Always a declared source: it
      joins the declared source set automatically even when
      declared_source_srg_ids omits it. STIG-kind components derive from
      non-core SRGs, SRG-kind components from core SRGs.
    example: 1
  declared_source_srg_ids:
    type: array
    description: >-
      The full declared source-SRG set for multi-parent derivation.
      Every listed SRG becomes a declared parent and contributes its
      requirements at creation (full union by default). Eligibility is
      enforced per document_type — non-core SRGs for stig, core
      SRGs for srg. Omit for the classic single-source create.
    items:
      type: integer
    example: [1, 2]
  requirement_selections:
    type: object
    description: >-
      Selective-import filter. Keys are declared source SRG ids, values
      the requirement versions to import from that source. When present,
      only the listed requirements are imported and a declared source
      absent from the map contributes none; when omitted, creation
      imports the full union of every declared source.
    additionalProperties:
      type: array
      items:
        type: string
    example:
      '1': [SRG-OS-000001, SRG-OS-000002]
      '2': [SRG-APP-000101]
  name:
    type: string
    description: Human-readable component name.
    example: Container SRG
  prefix:
    type: string
    description: Short alphanumeric prefix used to construct rule IDs (e.g. CNTR in CNTR-00-000050).
    example: CNTR
  document_type:
    type: string
    description: >-
      Authoring profile for the new component: stig authors STIG
      requirements from a source SRG; srg authors SRG requirements.
      Defaults to stig; immutable after creation.
    enum:
      - stig
      - srg
    example: stig
  version:
    type: integer
    description: Version number of the component.
    example: 1
  release:
    type: integer
    description: Release number of the component.
    example: 1
  title:
    type: string
    description: Full official title of the component.
    example: Container Platform Security Technical Implementation Guide
  description:
    type: string
    description: Optional longer description of the component scope and purpose.
    example: STIG guidance for container orchestration platform deployments.

description: >-
  Project-level rule statistics: totals aggregated across every component
  plus a per-component breakdown. Percentages are null when a denominator
  is zero.
type: object
required:
  - aggregate
  - components
additionalProperties: false
properties:
  aggregate:
    $ref: ./ComponentStatsResponse.yaml
  components:
    type: array
    description: Per-component breakdown, ordered by prefix.
    items:
      type: object
      required:
        - id
        - name
        - prefix
        - rule_count
        - completion_pct
        - lock_pct
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Component identifier.
          example: 38
        name:
          type: string
          description: Component name.
          example: RHEL 9 Hardened Baseline
        prefix:
          type: string
          description: STIG ID prefix.
          example: RHEL-09
        rule_count:
          type: integer
          description: Rules in this component.
          example: 203
        completion_pct:
          type:
            - number
            - 'null'
          description: Percentage of determined rules. Null when the component has no rules.
          example: 75.4
        lock_pct:
          type:
            - number
            - 'null'
          description: Percentage of locked rules. Null when the component has no rules.
          example: 12.3

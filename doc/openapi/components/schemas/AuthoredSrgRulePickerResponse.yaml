description: >-
  A component-authored SRG requirement for picker dropdowns. Serialized by
  AuthoredSrgRuleBlueprint :picker view — the default requirement fields
  plus displayed_name. Carries no satisfaction relationships: authored
  requirements have no satisfies graph, and the keys are omitted entirely
  rather than sent empty. The closed property set keeps this shape disjoint
  from RulePickerResponse wherever the two appear in a oneOf.
type: object
required:
  - id
  - rule_id
  - locked
  - displayed_name
additionalProperties: false
properties:
  id:
    type: integer
    description: Unique requirement identifier.
    example: 10633
  rule_id:
    type: string
    description: Six-digit zero-padded requirement number combined with the component prefix to form the displayed ID.
    example: "000001"
  title:
    type:
      - string
      - 'null'
    description: Title of the requirement. Null if not yet authored.
    example: The container platform must enforce approved authorizations.
  version:
    type:
      - string
      - 'null'
    description: Requirement version identifier. Minted at release for authored requirements.
    example: null
  status:
    type:
      - string
      - 'null'
    description: Applicability status in the SRG authoring vocabulary.
    enum:
      - Not Yet Determined
      - Applicable
      - Not Applicable
      - null
    example: Applicable
  rule_severity:
    type:
      - string
      - 'null'
    description: DISA severity level.
    enum:
      - low
      - medium
      - high
      - null
    example: medium
  locked:
    type: boolean
    description: Whether the requirement is locked from further edits.
    example: false
  review_requestor_id:
    type:
      - integer
      - 'null'
    description: ID of the user who requested review. Null if no review requested.
    example: null
  changes_requested:
    type: boolean
    description: Whether changes have been requested during review.
    example: false
  comment_summary:
    type: object
    description: Per-requirement comment counts.
    required:
      - open
      - total
    additionalProperties: false
    properties:
      open:
        type: integer
        description: Comments not yet adjudicated, including replies under open parents.
        example: 0
      total:
        type: integer
        description: Total comment count across all statuses.
        example: 0
  displayed_name:
    type: string
    description: Component-scoped display name (PREFIX-rule_id).
    example: RCPK-00-000001

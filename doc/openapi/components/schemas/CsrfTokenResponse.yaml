description: Authenticity token for the caller's current session, to be sent as X-CSRF-Token on state-changing requests.
type: object
additionalProperties: false
required:
  - csrf_token
properties:
  csrf_token:
    type: string
    description: URL-safe Base64 authenticity token, masked differently on every response, bound to the session cookie that accompanies this response.
    example: ablKiE91Uc5-POdKUVYtj6i_dtyEVdVLA4klsLgcJzs72TdAB9f9P-TGGl8_v0mhoggETWULHFKLMfubDR_u0w

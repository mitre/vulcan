description: >-
  A relocation proposal in the per-SRG backlog: the open proposal
  plus enough source identity to act on it, or a retained non-concur
  whose rationale communicates the refusal back to the source author.
  Executed relocation records are immutable history and never served
  here.
type: object
additionalProperties: false
required:
  - id
  - source_rule_id
  - target_technology_token
  - source_displayed_name
  - component_id
properties:
  id:
    type: integer
    description: Relocation record identifier.
    example: 12
  source_rule_id:
    type: integer
    description: The authored requirement proposed for relocation.
    example: 5137
  target_technology_token:
    type: string
    description: >-
      The destination SRG's abbreviation (CTR, GPOS, DB — the SRG-world
      analogue of a STIG component prefix).
    example: CTR
  created_at:
    type: string
    description: When the marker was created. Blueprinter format.
    example: "2026-07-20 15:36:06 UTC"
  source_displayed_name:
    type: string
    description: Component-prefixed requirement name of the source.
    example: CNTR-00-000051
  component_id:
    type: integer
    description: The source requirement's component.
    example: 42
  component_name:
    type:
      - string
      - 'null'
    description: Name of the source component.
    example: Container Platform SRG
  requested_by_name:
    type:
      - string
      - 'null'
    description: Who marked the requirement. Null when the account was removed.
    example: Jane Doe
  declined_at:
    type:
      - string
      - 'null'
    description: >-
      When the receiving side declined the proposal. Null while the
      proposal is open. Blueprinter format.
    example: null
  adjudication_rationale:
    type:
      - string
      - 'null'
    description: >-
      Why the proposal was declined — required on every decline, shown
      to the source author. Null while the proposal is open.
    example: null
  declined_by_name:
    type:
      - string
      - 'null'
    description: >-
      Who declined the proposal. Null while open or when the account was
      removed.
    example: null

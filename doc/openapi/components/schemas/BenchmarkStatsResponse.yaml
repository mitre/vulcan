description: >-
  Aggregate stats for a benchmark. SRG responses include a usage section —
  which components are based on the SRG, scoped to components the caller can
  see (member projects or released). STIG responses carry counts only.
type: object
required:
  - rule_count
  - severity_counts
additionalProperties: false
properties:
  rule_count:
    type: integer
    description: Total number of rules in the benchmark.
    example: 250
  severity_counts:
    type: object
    description: Rule counts grouped by severity (SQL aggregate).
    required:
      - high
      - medium
      - low
    additionalProperties: false
    properties:
      high:
        type: integer
        description: Count of CAT I (high severity) rules.
        example: 30
      medium:
        type: integer
        description: Count of CAT II (medium severity) rules.
        example: 200
      low:
        type: integer
        description: Count of CAT III (low severity) rules.
        example: 20
  usage:
    type: object
    description: >-
      Components based on this SRG, scoped to the caller's visibility
      (member projects or released). Present only on SRG stats responses.
    required:
      - count
      - components
    additionalProperties: false
    properties:
      count:
        type: integer
        description: Number of caller-visible components based on this SRG.
        example: 2
      components:
        type: array
        description: Caller-visible components, ordered by prefix.
        items:
          type: object
          required:
            - id
            - name
            - project_id
            - project_name
          additionalProperties: false
          properties:
            id:
              type: integer
              description: Component identifier.
              example: 38
            name:
              type: string
              description: Component name.
              example: RHEL 9 Hardened Baseline
            project_id:
              type: integer
              description: Owning project identifier.
              example: 7
            project_name:
              type: string
              description: Owning project name.
              example: Photon OS 5 Hardening

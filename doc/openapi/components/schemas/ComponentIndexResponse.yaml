description: >-
  Component listing entry for project pages. Serialized by ComponentBlueprint :index view.
  Extends ComponentSummary (default fields) with index-specific fields.
allOf:
  - $ref: ./ComponentSummary.yaml
  - type: object
    properties:
      updated_at:
        type: string
        description: Timestamp when the component was last modified. Format is "YYYY-MM-DD HH:MM:SS UTC" (Blueprinter default).
        example: "2026-05-29 15:36:06 UTC"
      released:
        type: boolean
        description: Whether this component has been marked as released (finalized).
        example: true
      rules_count:
        type: integer
        description: >-
          Number of requirement rows (security controls) in this component —
          rules for stig-kind components, authored requirements for srg-kind
          components.
        example: 203
      component_id:
        type:
          - integer
          - 'null'
        description: ID of the source component if this is an overlay. Null for original components.
        example: null
      lock_summary:
        type: object
        description: >-
          Lock progress for this component's requirements, powering the project-page
          lock indicator (an all-locked badge versus an "N of M locked" partial indicator).
        required:
          - locked
          - total
          - all_locked
        properties:
          locked:
            type: integer
            description: Number of requirements that are locked.
            example: 12
          total:
            type: integer
            description: Total number of requirements in the component.
            example: 30
          all_locked:
            type: boolean
            description: True when the component has requirements and every one is locked.
            example: false

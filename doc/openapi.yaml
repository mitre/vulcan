                      - 'null'
                  email:
                    type: string
                    format: email
            access_requests:
              type: array
              description: Pending access requests from non-member users.
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Access request ID.
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type:
                          - string
                          - 'null'
                      email:
                        type: string
                        format: email
                  project_id:
                    type: integer
    ToastResponse:

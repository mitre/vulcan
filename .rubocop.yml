require:
  - ./lib/rubocop/cop/vulcan/comment_tracker
  - ./lib/rubocop/cop/vulcan/kind_seam_query
  - ./lib/rubocop/cop/vulcan/let_it_be_refind

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-capybara
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - bin/*
    - db/schema.rb
    - db/migrate/*
    # - config/initializers/*
    - node_modules/**/*
    - docs/node_modules/**/*
    - "vendor/**/*"
    - tmp/**/*
    - downloads/**/*
    - "**/*.haml"
# DISABLED: Following Standard Ruby - line length auto-correction is destructive
# It can corrupt code when combined with other cops (e.g., Rails/FilePath path duplication)
# See: https://github.com/standardrb/standard
Layout/LineLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Max: 120
  Exclude:
    - spec/**/*
Metrics/AbcSize:
  Enabled: false
Metrics/ClassLength:
  Max: 750
Metrics/ParameterLists:
  Max: 8
Metrics/BlockLength:
  Enabled: false
  Exclude:
    - spec/**/*
Rails/ContentTag:
  Enabled: true
  Exclude:
    - "app/lib/**/*"
# 'slashes' style is simpler and avoids potential auto-correction issues
# Rails.root.join('path/to/file') vs Rails.root.join('path', 'to', 'file')
Rails/FilePath:
  EnforcedStyle: slashes
Rails/HasAndBelongsToMany:
  Enabled: false
# RSpec configuration - more lenient for existing codebase
RSpec/ExampleLength:
  Max: 120
  Exclude:
    - spec/**/*_integration_spec.rb
    - spec/**/*_critical_*_spec.rb
RSpec/MultipleExpectations:
  Max: 15
RSpec/MessageSpies:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/SpecFilePathSuffix:
  Enabled: false
RSpec/LeakyConstantDeclaration:
  Enabled: false
RSpec/DescribedClass:
  Enabled: false
RSpec/ContextWording:
  Enabled: false
RSpec/VerifiedDoubles:
  Enabled: false
RSpec/BeforeAfterAll:
  Enabled: false
RSpec/AnyInstance:
  Enabled: false
RSpec/StubbedMock:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
Style/OpenStructUse:
  Exclude:
    - spec/**/*
Rails/SkipsModelValidations:
  Exclude:
    - spec/**/*
    - lib/tasks/**/*
    # Migrations operate at the schema/data level via migration-local models
    # with no validations — bulk backfills legitimately use insert_all/update_all.
    - db/migrate/**/*
# FactoryBot/FactoryAssociationWithStrategy changes build vs create behavior —
# fixing requires verifying all tests still pass with implicit associations.
# TODO: Fix factories to use implicit associations in dedicated session.
FactoryBot/FactoryAssociationWithStrategy:
  Enabled: false

# ============================================================================
# PRE-EXISTING OFFENSES FROM RUBOCOP 1.25.1 → 1.79.2 UPGRADE
# These issues existed in master before the Ruby 3.1 upgrade (January 2025)
# See RUBOCOP-TECH-DEBT.md for tracking and fix strategies
# ============================================================================

# Map method chain optimization — existing pattern is clearer for intent
Performance/MapMethodChain:
  Enabled: false

# Hardcoded strings that should be in locale files
Rails/I18nLocaleTexts:
  Exclude:
    - app/controllers/stigs_controller.rb
    - app/controllers/users/registrations_controller.rb
    - app/models/additional_answer.rb
    - app/models/component_metadata.rb
    - app/models/membership.rb
    - app/models/project_access_request.rb
    - app/models/project_metadata.rb
    - app/models/security_requirements_guide.rb
    - app/models/stig.rb

# Large data collection hardcoded in source (1 occurrence)
Metrics/CollectionLiteralLength:
  Exclude:
    - app/lib/cci_map/constants.rb

# Methods that should end with ? (4 occurrences)
Naming/PredicateMethod:
  Exclude:
    - app/lib/xccdf/ident.rb
    - app/models/component.rb
    - app/models/concerns/prefix_validator.rb
    - app/controllers/concerns/oidc_discovery_helper.rb

# Safe navigation chains longer than 2 calls (5 occurrences)
Style/SafeNavigationChainLength:
  Exclude:
    - app/models/base_rule.rb
    - app/models/check.rb
    - app/models/component.rb
    - lib/tasks/stig_and_srg_puller.rake

# Missing class documentation comments (9 occurrences)
Style/Documentation:
  Exclude:
    - db/migrate/*
    - spec/**/*
    - app/lib/xccdf/idref/overrideable_idref.rb
    - app/lib/xccdf/item/selectable_item.rb
    - app/lib/xccdf/item/selectable_item/group.rb
    - app/lib/xccdf/item/selectable_item/rule.rb
    - app/lib/xccdf/item/value.rb
    - app/lib/xccdf/warning.rb
    - app/models/component_metadata.rb
    - app/models/project_access_request.rb
    - app/models/project_metadata.rb

# DISABLED: ScatteredSetup autocorrect merges before hooks and can break
# order-dependent setup (e.g., creating records before membership associations).
# The inline disable is safer but this prevents accidental --autocorrect damage.
RSpec/ScatteredSetup:
  AutoCorrect: false

# Search specs and integration specs legitimately need many let declarations
# for test data setup across multiple search categories
RSpec/MultipleMemoizedHelpers:
  Max: 12

# let! is used intentionally to ensure database records exist before queries.
# These are not "unused" — they're setup data that must exist in the DB.
RSpec/LetSetup:
  Enabled: false

# receive_message_chain is necessary for Settings stubbing and complex Rails chains
RSpec/MessageChain:
  Enabled: false

# Repeated examples flagged in components satisfaction spec are intentional parametric tests
RSpec/RepeatedExample:
  Exclude:
    - spec/models/components_satisfactions_spec.rb

# Test let statements with numbers in names
RSpec/IndexedLet:
  Exclude:
    - spec/controllers/registrations_controller_spec.rb
    - spec/models/project_access_request_spec.rb
    - spec/requests/api/search_spec.rb
    - spec/models/rule_search_spec.rb
    - spec/models/srg_csv_export_spec.rb
    - spec/models/stig_csv_export_spec.rb

# The kind-seam query invariant: requirement-scoped queries route through
# Component#requirements / BaseRule.live_for_components — Rule is the STIG
# STI subclass and structurally excludes authored SRG requirements. Each
# excluded file below is either a deliberately STIG-only surface or the
# seam's own implementation; in-flight gaps are marked and leave the list
# when their kind-routing lands. Never quiet this cop inline.
Vulcan/KindSeamQuery:
  Include:
    - app/**/*.rb
    - lib/tasks/**/*.rake
    - lib/tasks/**/*.rb
  Exclude:
    # The kind seam's own home — requirements routes to rules for stig kind,
    # and the Rule-only copy/import internals are guarded at their doors.
    - app/models/component.rb
    # Rule-internal counter-cache maintenance (SRG counts are live queries).
    - app/models/rule.rb
    # Kind-routed at the mode seam — the rules branch serves non-SRG modes.
    - app/services/export/base.rb
    # Kind-routed builder — the rules branch is the stig import path.
    - app/services/import/json_archive/rule_builder.rb
    # InSpec control-file diff — InSpec is structurally STIG-only.
    - app/controllers/components_controller.rb
    # Editor payload is kind-routed in-file; related_rules is deliberately
    # Rule-only (no authored equivalent surface).
    - app/controllers/rules_controller.rb
    # Global search kind-awareness is in flight — remove when it lands.
    - app/controllers/api/search_controller.rb
    # ADNM automation walks the satisfies graph — structurally STIG-only.
    - lib/tasks/fix_adnm_status.rake
    # Satisfaction-nesting maintenance for the stig-kind container test
    # dataset — walks the satisfies graph, structurally STIG-only.
    - lib/tasks/container_srg_nesting_fix.rake

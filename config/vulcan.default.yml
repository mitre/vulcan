# DO NOT EDIT THIS FILE! If you need to change settings in this file,
# make a copy called vulcan.yml and customize your configuration there.
#
# If you do not use environment variables to setup your settings,
# then you are welcome to remove all of the ENV declarations below
# and simply input your settings instead.
#
# Any changes to this file will requre a restart of the Vulcan service.

defaults: &defaults
  # Free-form string values are emitted with to_json: a bare ERB
  # interpolation whose value starts with '#' (Slack channels, hex colors,
  # passwords) turns the rest of the line into a YAML comment and the
  # setting silently becomes nil. JSON strings are valid YAML scalars and
  # escape every special character; nil still renders as YAML null.
  welcome_text: <%= (ENV['VULCAN_WELCOME_TEXT'] || 'Welcome to Vulcan').to_json %>
  contact_email: <%= ENV['VULCAN_CONTACT_EMAIL']&.to_json %>
  app_url: <%= ENV['VULCAN_APP_URL']&.to_json %>
  smtp:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_ENABLE_SMTP']) %>
    settings:
      address: <%= ENV['VULCAN_SMTP_ADDRESS']&.to_json %>
      port: <%= ENV['VULCAN_SMTP_PORT'] %>
      domain: <%= ENV['VULCAN_SMTP_DOMAIN']&.to_json %>
      authentication: <%= ENV['VULCAN_SMTP_AUTHENTICATION']&.to_sym %>
      tls: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_SMTP_TLS']) %>
      openssl_verify_mode: <%= ENV['VULCAN_SMTP_OPENSSL_VERIFY_MODE']&.to_json %>
      enable_starttls_auto: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_SMTP_ENABLE_STARTTLS_AUTO']) %>
      user_name: <%= ENV['VULCAN_SMTP_SERVER_USERNAME']&.to_json %>
      password: <%= ENV['VULCAN_SMTP_SERVER_PASSWORD']&.to_json %>
  local_login:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_ENABLE_LOCAL_LOGIN']) != false %>
    email_confirmation: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_ENABLE_EMAIL_CONFIRMATION']) || false %>
    # Accepts: plain seconds (600), or with suffix: 10m, 15m, 1h
    # Default: 600 (10 min) per DoD AC-12 STIG requirement.
    session_timeout: <%= (ENV['VULCAN_SESSION_TIMEOUT'] || 600).to_i %>
    remember_me_enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_ENABLE_REMEMBER_ME']) != false %>
    # Accepts: plain seconds (28800), or with suffix: 8h, 480m
    # Default: 28800 (8 hours). Set to 0 to disable remember me entirely.
    remember_me_duration: <%= (ENV['VULCAN_REMEMBER_ME_DURATION'] || 28800).to_i %>
  user_registration:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_ENABLE_USER_REGISTRATION']) != false %>
  admin_bootstrap:
    # When true, the first user to register/login becomes an admin (if no admins exist)
    # This makes Docker deployments functional immediately without manual setup
    first_user_admin: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_FIRST_USER_ADMIN']) != false %>
  project:
    create_permission_enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_PROJECT_CREATE_PERMISSION_ENABLED']) != false %>
  # When true, automatically links an external identity (OIDC, LDAP, GitHub) to an
  # existing local account with the same email. Only enable when ALL configured
  # identity providers verify email ownership (e.g., enterprise Okta, corporate LDAP).
  # When false (default), users see a clear error directing them to sign in with
  # their existing method or contact an administrator to link accounts.
  auto_link_user: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_AUTO_LINK_USER']) || false %>
  ldap:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_ENABLE_LDAP']) || false %>
    servers:
      main:
        host: <%= (ENV['VULCAN_LDAP_HOST'] || 'localhost').to_json %>
        port: <%= ENV['VULCAN_LDAP_PORT'] || 389 %>
        title: <%= (ENV['VULCAN_LDAP_TITLE'] || 'LDAP').to_json %>
        uid: <%= (ENV['VULCAN_LDAP_ATTRIBUTE'] || 'uid').to_json %>
        encryption: <%= (ENV['VULCAN_LDAP_ENCRYPTION'] || 'plain').to_json %> # "start_tls" or "simple_tls" or "plain"
        bind_dn: <%= ENV['VULCAN_LDAP_BIND_DN']&.to_json %> # The user you will bind as
        password: <%= ENV['VULCAN_LDAP_ADMIN_PASS']&.to_json %>
        base: <%= ENV['VULCAN_LDAP_BASE']&.to_json %>
  oidc:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_ENABLE_OIDC']) || false %>
    strategy: :openid_connect
    title: <%= (ENV['VULCAN_OIDC_PROVIDER_TITLE'] || 'OIDC Provider').to_json %>
    # Multi-provider registry.
    # One entry per VULCAN_OIDC_PROVIDERS key, or a single `oidc` provider from
    # the unprefixed legacy vars when the registry is unset. Built by the tested
    # OidcProviderRegistry and embedded as JSON (valid YAML flow).
    providers: <%= ::OidcProviderRegistry.from_env.to_json %>
    args:
      name: :oidc
      scope:
      - :openid
      - :email
      - :profile
      uid_field: 'sub'
      response_type: :code
      discovery: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_OIDC_DISCOVERY']) != false %>
      issuer: <%= ENV['VULCAN_OIDC_ISSUER_URL']&.to_json %>
      client_auth_method: :secret
      client_signing_alg: <%= ENV['VULCAN_OIDC_CLIENT_SIGNING_ALG']&.to_sym || :RS256 %>
      prompt: <%= ENV['VULCAN_OIDC_PROMPT']&.to_json %>
      client_options:
        port: <%= ENV['VULCAN_OIDC_PORT'] || 443 %>
        scheme: <%= (ENV['VULCAN_OIDC_SCHEME'] || 'https').to_json %>
        host: <%= ENV['VULCAN_OIDC_HOST']&.to_json %>
        identifier: <%= ENV['VULCAN_OIDC_CLIENT_ID']&.to_json %>
        secret: <%= ENV['VULCAN_OIDC_CLIENT_SECRET']&.to_json %>
        redirect_uri: <%= ENV['VULCAN_OIDC_REDIRECT_URI']&.to_json %>
        # Fallback/override endpoints (only used if discovery fails or disabled)
        authorization_endpoint: <%= ENV['VULCAN_OIDC_AUTHORIZATION_URL']&.to_json %>
        token_endpoint: <%= ENV['VULCAN_OIDC_TOKEN_URL']&.to_json %>
        userinfo_endpoint: <%= ENV['VULCAN_OIDC_USERINFO_URL']&.to_json %>
        jwks_uri: <%= ENV['VULCAN_OIDC_JWKS_URI']&.to_json %>
        # NOTE: no post-logout redirect here — SessionsController#destroy
        # builds the RP-initiated logout URL itself and always lands on
        # /users/signed_out (register it with the provider as a sign-out
        # redirect URI; see docs/deployment/auth/oidc-okta.md).
  banner:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_BANNER_ENABLED']) || false %>
    text: <%= (ENV['VULCAN_BANNER_TEXT'] || '').to_json %>
    background_color: <%= ENV.fetch('VULCAN_BANNER_BACKGROUND_COLOR', '#007a33').to_json %>
    text_color: <%= ENV.fetch('VULCAN_BANNER_TEXT_COLOR', '#ffffff').to_json %>
  consent:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_CONSENT_ENABLED']) || false %>
    version: <%= ENV.fetch('VULCAN_CONSENT_VERSION', '1').to_i %>
    title: <%= ENV.fetch('VULCAN_CONSENT_TITLE', 'Terms of Use').to_json %>
    content: <%= (ENV['VULCAN_CONSENT_CONTENT'] || '').to_json %>
    ttl: <%= ENV.fetch('VULCAN_CONSENT_TTL', '0').to_i %>
  session_limits:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV.fetch('VULCAN_SESSION_LIMITS_ENABLED', 'true')) != false %>
    max_sessions: <%= ENV.fetch('VULCAN_MAX_CONCURRENT_SESSIONS', '1').to_i %>
  lockout:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV.fetch('VULCAN_LOCKOUT_ENABLED', 'true')) != false %>
    maximum_attempts: <%= ENV.fetch('VULCAN_LOCKOUT_MAX_ATTEMPTS', '3').to_i %>
    unlock_in_minutes: <%= ENV.fetch('VULCAN_LOCKOUT_UNLOCK_IN_MINUTES', '15').to_i %>
    unlock_strategy: <%= ENV.fetch('VULCAN_LOCKOUT_UNLOCK_STRATEGY', 'both').to_json %>
    last_attempt_warning: <%= ActiveModel::Type::Boolean.new.cast(ENV.fetch('VULCAN_LOCKOUT_LAST_ATTEMPT_WARNING', 'true')) != false %>
  password:
    min_length: <%= ENV.fetch('VULCAN_PASSWORD_MIN_LENGTH', '15').to_i %>
    min_uppercase: <%= ENV.fetch('VULCAN_PASSWORD_MIN_UPPERCASE', '2').to_i %>
    min_lowercase: <%= ENV.fetch('VULCAN_PASSWORD_MIN_LOWERCASE', '2').to_i %>
    min_number: <%= ENV.fetch('VULCAN_PASSWORD_MIN_NUMBER', '2').to_i %>
    min_special: <%= ENV.fetch('VULCAN_PASSWORD_MIN_SPECIAL', '2').to_i %>
  input_limits:
    # Maximum lengths for text fields, grouped by category.
    # Based on analysis of real DISA STIG/SRG data (1,785 rules across 8 benchmarks).
    # Admins can tune via environment variables per deployment.
    short_string: <%= ENV.fetch('VULCAN_LIMIT_SHORT_STRING', '255').to_i %>
    ident: <%= ENV.fetch('VULCAN_LIMIT_IDENT', '2048').to_i %>
    title: <%= ENV.fetch('VULCAN_LIMIT_TITLE', '500').to_i %>
    medium_text: <%= ENV.fetch('VULCAN_LIMIT_MEDIUM_TEXT', '1000').to_i %>
    long_text: <%= ENV.fetch('VULCAN_LIMIT_LONG_TEXT', '10000').to_i %>
    inspec_code: <%= ENV.fetch('VULCAN_LIMIT_INSPEC_CODE', '50000').to_i %>
    component_name: <%= ENV.fetch('VULCAN_LIMIT_COMPONENT_NAME', '255').to_i %>
    component_prefix: <%= ENV.fetch('VULCAN_LIMIT_COMPONENT_PREFIX', '10').to_i %>
    component_title: <%= ENV.fetch('VULCAN_LIMIT_COMPONENT_TITLE', '500').to_i %>
    component_description: <%= ENV.fetch('VULCAN_LIMIT_COMPONENT_DESCRIPTION', '5000').to_i %>
    project_name: <%= ENV.fetch('VULCAN_LIMIT_PROJECT_NAME', '255').to_i %>
    project_description: <%= ENV.fetch('VULCAN_LIMIT_PROJECT_DESCRIPTION', '5000').to_i %>
    user_name: <%= ENV.fetch('VULCAN_LIMIT_USER_NAME', '255').to_i %>
    user_email: <%= ENV.fetch('VULCAN_LIMIT_USER_EMAIL', '255').to_i %>
    review_comment: <%= ENV.fetch('VULCAN_LIMIT_REVIEW_COMMENT', '10000').to_i %>
    benchmark_name: <%= ENV.fetch('VULCAN_LIMIT_BENCHMARK_NAME', '500').to_i %>
    benchmark_title: <%= ENV.fetch('VULCAN_LIMIT_BENCHMARK_TITLE', '500').to_i %>
    benchmark_description: <%= ENV.fetch('VULCAN_LIMIT_BENCHMARK_DESCRIPTION', '10000').to_i %>
  import:
    # Maximum total uncompressed size of all entries in a json_archive zip
    # upload, in megabytes. Pre-decompression upload caps in the controller
    # (100 MB) and rubyzip's per-entry validation don't catch zip-bomb
    # geometries where small archives expand to gigabytes.
    json_archive_size_budget_mb: <%= ENV.fetch('VULCAN_IMPORT_JSON_ARCHIVE_SIZE_BUDGET_MB', '500').to_i %>
  api_tokens:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV.fetch('VULCAN_API_TOKENS_ENABLED', 'true')) != false %>
    max_tokens_per_user: <%= ENV.fetch('VULCAN_API_TOKENS_MAX_PER_USER', '20').to_i %>
    max_lifetime_days: <%= ENV.fetch('VULCAN_API_TOKENS_MAX_LIFETIME_DAYS', '365').to_i %>
    auto_revoke_idle_days: <%= ENV.fetch('VULCAN_API_TOKENS_AUTO_REVOKE_IDLE_DAYS', '90').to_i %>
  docs:
    # The documentation site is served through a controller rather than from
    # public/, because anything under public/ is served before routing runs and
    # so could never be placed behind a login. Serving it this way keeps both
    # outcomes one setting apart. Public by default: the same content is already
    # published openly.
    require_login: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_DOCS_REQUIRE_LOGIN']) || false %>
  slack:
    enabled: <%= ActiveModel::Type::Boolean.new.cast(ENV['VULCAN_ENABLE_SLACK_COMMS']) || false %>
    api_token: <%= ENV['VULCAN_SLACK_API_TOKEN']&.to_json %>
    channel_id: <%= ENV['VULCAN_SLACK_CHANNEL_ID']&.to_json %>
  providers:
    # - { name: 'github',
    #     app_id: '<APP_ID>',
    #     app_secret: '<APP_SECRET>',
    #     args: { scope: 'user:email' } }

development:
  <<: *defaults
test:
  <<: *defaults
production:
  <<: *defaults

name: Deploy VitePress Documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs/**'
      - 'doc/openapi.yaml'
      - 'doc/openapi/**'
      - '.github/workflows/docs.yml'
  # Build-only check on PRs: a dead link (or any docs build failure) is caught
  # in the pipeline BEFORE it reaches a Heroku deploy preview. Uses the same
  # frozen-lockfile deps as the deploy build, so it reproduces Heroku exactly.
  # The Pages/deploy steps stay push-only (guarded below).
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'docs/**'
      - 'doc/openapi.yaml'
      - 'doc/openapi/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  # Per-ref so a PR build-check never cancels the Pages deploy or another PR's
  # check. Master/main deploys keep their own serialized group.
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Required: VitePress lastUpdated uses git log timestamps

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Docs use Node 24 (same as app). The docs/ subdirectory has its own
          # package.json with VitePress/Vue 3 — isolated from the main app's Vue 2.
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: docs/yarn.lock

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install root dependencies (for redocly CLI)
        run: yarn install --frozen-lockfile

      - name: Generate OpenAPI JSON for docs
        run: yarn openapi:docs

      - name: Install and build docs
        env:
          # Selects the published-site entry in docs/.vitepress/target.mjs,
          # which sets the / base for the custom domain along with everything
          # else that differs for a public build.
          VULCAN_DOCS_TARGET: "pages"
        run: |
          # Docs have their own package.json with Vue 3 deps (isolated from
          # the Rails app's Vue 2). Install only docs deps in CI.
          cd docs
          yarn install --frozen-lockfile
          yarn build

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

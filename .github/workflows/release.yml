name: Release

# Publishes the stable image for a GitHub Release: mitre/vulcan:<x.y.z> and
# mitre/vulcan:release-latest, plus the Iron Bank merge request on repo1.
#
# Trigger: publishing a GitHub Release in the UI (see
# docs/site/development/release-process.md). workflow_dispatch exists to
# re-run the publish for a tag that was already released, which is the
# recovery path when the publish itself failed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)publish, e.g. v2.5.0. Defaults to the ref the workflow was dispatched from.'
        required: false
        type: string
      builder:
        description: 'Build driver. emulated is free and takes ~65 min; cloud takes 2-10 min but spends the org shared Build Cloud minutes.'
        required: false
        default: emulated
        type: choice
        options:
          - emulated
          - cloud

# Two publishes of the same tag must not race each other for `release-latest`.
# Serialise per tag, and never cancel a publish in flight — a half-pushed
# manifest list is worse than a slow one.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate the publish on the three things that can make a release ship the
  # wrong bits. Deliberately a *gate*, not a re-run of the suite: ci.yml
  # already tested this exact tree on the version-bump commit, so re-running
  # it would add ~15 minutes to every release to re-prove the same result.
  # This job proves instead that the tag really points at that tested,
  # on-master, correctly-bumped commit, and costs seconds.
  verify:
    name: Verify the tag is releasable
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # read ci.yml's conclusion for the tagged commit
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # DockerHub tags carry no `v` prefix (mitre/vulcan:2.4.1, not :v2.4.1),
      # so the version is the tag with the prefix stripped.
      - name: Resolve the tag, its commit, and the unprefixed image version
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$RAW_TAG" ]]; then
            echo "::error::Could not determine a release tag to publish."
            exit 1
          fi
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW_TAG' is not a vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RAW_TAG}" --jq '.sha')"
          {
            echo "tag=$RAW_TAG"
            echo "version=${RAW_TAG#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $RAW_TAG ($sha) as mitre/vulcan:${RAW_TAG#v}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      # The version bump must land before the tag. If the tag points at a
      # commit whose VERSION file says something else, the image would be
      # pushed under a tag that disagrees with Vulcan::VERSION inside it.
      - name: VERSION at the tagged commit must equal the tag
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$file_version" != "$TAG" ]]; then
            echo "::error::VERSION at $TAG reads '$file_version'. Tag the commit that bumps VERSION to '$TAG'."
            exit 1
          fi
          echo "VERSION == $TAG"

      - name: The tagged commit must be an ancestor of master
        shell: bash
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "::error::$SHA is not on master. Releases are cut from master only."
            exit 1
          fi
          echo "$SHA is on master"

      # Nothing else in the pipeline checks this. Without it, publishing a
      # release off a red commit ships an untested image to DockerHub and to
      # Iron Bank, which is exactly the hole the old docs claimed was closed.
      - name: CI must have passed for the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          conclusions="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=completed" \
            --jq '[.workflow_runs[].conclusion] | unique | join(" ")')"
          if [[ -z "$conclusions" ]]; then
            echo "::error::No completed push-event CI run found for $SHA. Let CI finish on master before publishing the release."
            exit 1
          fi
          if [[ " $conclusions " != *" success "* ]]; then
            echo "::error::CI for $SHA concluded '$conclusions', not success. Fix master and re-run CI before publishing."
            exit 1
          fi
          echo "CI for $SHA concluded: $conclusions"

  publish:
    needs: verify
    permissions:
      contents: write   # anchore/sbom-action dependency-snapshot submission
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      # The verified commit, not github.ref: a workflow_dispatch re-publish
      # from the default branch must still build the tag's tree.
      ref: ${{ needs.verify.outputs.sha }}
      tag_suffixes: "${{ needs.verify.outputs.version }},release-latest"
      version: ${{ needs.verify.outputs.version }}
      # Driver selection, in precedence order, and every term here is
      # readable on the `release: published` trigger except the first:
      #
      #   1. inputs.builder   set only when a human re-dispatches the workflow
      #   2. vars.RELEASE_BUILDER
      #                       a repository variable. This is how an operator
      #                       asks for Build Cloud on a *real* release: set it
      #                       to `cloud` before clicking Publish, and unset it
      #                       afterwards. Without it there is no way to request
      #                       the fast driver on the release trigger, which is
      #                       why 2.4.1 could only be rescued by cancelling and
      #                       re-dispatching by hand.
      #   3. 'emulated'       the free default.
      #
      # The resolved value is printed and written to the run summary by the
      # publish job, so the path taken is never invisible - which was the
      # original defect, and would be just as bad with the polarity reversed.
      builder: ${{ inputs.builder || vars.RELEASE_BUILDER || 'emulated' }}
      ironbank_project_id: 17073
      ironbank_clone_url: repo1.dso.mil/dsop/mitre/security-automation-framework/vulcan.git
      ironbank_commit_author_name: "Automated Vulcan Release"
      submit_sbom: true
    secrets: inherit

name: Release

# Publishes mitre/vulcan:<x.y.z> and :release-latest, plus the Iron Bank
# merge request. See docs/site/development/release-process.md.
#
# No workflow_dispatch on purpose: re-run the failed run instead, which
# replays the release payload rather than taking the tag from a second source.

on:
  release:
    types: [published]

# Serialise per tag so two publishes cannot race for `release-latest`, and
# never cancel one in flight — a half-pushed manifest list is worse than none.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # The Releases UI can target any branch or commit, so master-ness and the
  # version bump are checked here. CI is not re-checked: branch protection
  # already requires a green, up-to-date PR to merge.
  verify:
    name: Verify the tag is releasable
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # DockerHub tags carry no `v` prefix, so the image version is the tag
      # with the prefix stripped.
      - name: Resolve the tag, its commit, and the unprefixed image version
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "$RAW_TAG" ]]; then
            echo "::error::Could not determine a release tag to publish."
            exit 1
          fi
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW_TAG' is not a vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RAW_TAG}" --jq '.sha')"
          {
            echo "tag=$RAW_TAG"
            echo "version=${RAW_TAG#v}"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $RAW_TAG ($sha) as mitre/vulcan:${RAW_TAG#v}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      # Otherwise the image ships under a tag that disagrees with the
      # Vulcan::VERSION inside it.
      - name: VERSION at the tagged commit must equal the tag
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$file_version" != "$TAG" ]]; then
            echo "::error::VERSION at $TAG reads '$file_version'. Tag the commit that bumps VERSION to '$TAG'."
            exit 1
          fi
          echo "VERSION == $TAG"

      - name: The tagged commit must be an ancestor of master
        shell: bash
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "::error::$SHA is not on master. Releases are cut from master only."
            exit 1
          fi
          echo "$SHA is on master"

  publish:
    needs: verify
    permissions:
      contents: write   # anchore/sbom-action dependency-snapshot submission
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      # Resolved once above, so the built tree is the tree that was checked.
      ref: ${{ needs.verify.outputs.sha }}
      tag_suffixes: "${{ needs.verify.outputs.version }},release-latest"
      version: ${{ needs.verify.outputs.version }}
      # Set the RELEASE_BUILDER repository variable to `cloud` for a fast
      # release, and unset it afterwards. A repository variable is used rather
      # than an input because inputs are empty on this trigger.
      builder: ${{ vars.RELEASE_BUILDER || 'emulated' }}
      ironbank_project_id: 17073
      ironbank_clone_url: repo1.dso.mil/dsop/mitre/security-automation-framework/vulcan.git
      ironbank_commit_author_name: "Automated Vulcan Release"
      submit_sbom: true
    secrets: inherit

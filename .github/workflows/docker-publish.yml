name: Docker publish

# Single implementation of "build the multi-arch image, push it to DockerHub,
# and open the matching Iron Bank merge request on repo1".
#
# Two callers use it, and they differ only in what they tag and which repo1
# project they file against:
#
#   release.yml   stable    tags <x.y.z> + release-latest   repo1 .../vulcan
#   mainline.yml  bleeding  tags <git sha> + latest         repo1 .../vulcan-mainline
#
# Keeping one copy is not cosmetic: these two workflows were duplicated
# line-for-line, and a build-driver regression that broke every release sat
# unnoticed for three releases because the duplicate kept "working" (slowly).

on:
  workflow_call:
    inputs:
      tag_suffixes:
        description: >-
          Comma-separated image tag suffixes for the bake `registry` target.
          The first entry is the immutable tag and becomes the image's
          org.opencontainers.image.version label.
        required: true
        type: string
      version:
        description: >-
          The version recorded in the Iron Bank hardening manifest and used to
          address the just-pushed image (semver for releases, git SHA for
          mainline). Must equal the first entry of tag_suffixes.
        required: true
        type: string
      ironbank_project_id:
        description: 'Numeric repo1 project id to open the merge request against.'
        required: true
        type: number
      ironbank_clone_url:
        description: 'repo1 clone URL (no scheme) for the target project.'
        required: true
        type: string
      ironbank_commit_author_name:
        description: 'Author name for the commit pushed to repo1.'
        required: true
        type: string
      submit_sbom:
        description: >-
          Generate an SBOM and submit it as a dependency snapshot to the GitHub
          dependency graph. Releases do this; mainline does not, because a
          snapshot per master push would churn the dependency graph.
          Requires the caller to grant `contents: write`.
        required: false
        default: false
        type: boolean
      ref:
        description: >-
          The commit, tag or branch to build. Callers must pass the exact ref
          the image represents. Defaulting to the workflow's own ref would be a
          trap: re-publishing a release via workflow_dispatch from the default
          branch would then build master's tree and push it under the release's
          version.
        required: true
        type: string
      builder:
        description: >-
          Which buildx driver to build on. Both produce the same
          two-architecture manifest list; they trade money for time.

            emulated  (DEFAULT) QEMU on the GitHub-hosted runner. Free -
                      standard runners cost nothing for public repositories -
                      and measured: the last five mainline builds of this
                      exact target took 62m13s, 62m35s, 63m15s, 63m43s and
                      64m10s, and every one pushed a working amd64+arm64
                      image. Emulation is slow, not broken.

            cloud     Docker Build Cloud. Each architecture builds on a native
                      machine: 2m35s-10m26s measured. Opt-in only, because the
                      minutes come from one small monthly pot shared by the
                      WHOLE MITRE organisation and Vulcan is one team of
                      several. Ask for it when a release needs to be fast.

          This is a workflow_call input with a declared default, which is
          populated on every trigger. It is deliberately not read from the
          event payload's dispatch fields: those are empty on the
          `release: published` and `push:` triggers, so a driver chosen from
          them is unaskable on a real release and silently resolves to the
          other branch.
        required: false
        default: emulated
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Derived from the builder, never supplied by the caller, so the budget
    # cannot disagree with the path. "Slow driver selected, fast driver's
    # budget applied" is precisely how 2.4.0, 2.4.1 and 2.4.2 were cancelled.
    #   cloud     25 = ~2.5x the slowest cloud release on record (10m26s, v2.3.6)
    #   emulated 120 = ~1.9x the slowest observed emulated build (64m10s)
    timeout-minutes: ${{ inputs.builder == 'cloud' && 25 || 120 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      # Validate and announce the driver before anything depends on it. The
      # original defect was invisible: the workflow quietly took a path nobody
      # had chosen, under a budget sized for the path it did not take. A
      # typo'd builder must fail here, and the choice must appear in the run.
      - name: Resolve the build driver
        shell: bash
        env:
          BUILDER: ${{ inputs.builder }}
        run: |
          set -euo pipefail
          case "$BUILDER" in
            emulated)
              summary="QEMU emulation on the runner (free; budget 120 min, expect ~65)"
              ;;
            cloud)
              summary="Docker Build Cloud (budget 25 min, expect 2-10; SPENDS the organisation's shared monthly minutes)"
              ;;
            *)
              echo "::error::Unknown builder '$BUILDER'. Expected 'emulated' or 'cloud'."
              exit 1
              ;;
          esac
          echo "Build driver: $BUILDER - $summary"
          {
            echo "### Build driver: \`$BUILDER\`"
            echo ""
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      # Docker Build Cloud: opt-in, never the default. Each architecture builds
      # on a native machine and the builder keeps its own persistent layer
      # cache, so a cold build measures 2m35s (run 33083040270) against ~63
      # minutes emulated. The minutes come from one small monthly pot shared
      # across the whole organisation, so this path is requested deliberately -
      # by a repository variable before publishing, or by re-dispatching.
      #
      # If Build Cloud is unavailable or the pot is exhausted, this step fails
      # in under a minute. It does not degrade to the emulated path, because
      # this job is then budgeted at 25 minutes and an emulated build needs
      # ~63: a slow driver running under a fast driver's budget is exactly how
      # 2.4.0, 2.4.1 and 2.4.2 were cancelled. Re-run without the opt-in and
      # the default emulated path applies, with its own 120-minute budget.
      - name: Set up Docker Buildx (Docker Build Cloud)
        if: inputs.builder == 'cloud'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          driver: cloud
          endpoint: ${{ vars.DOCKER_BUILD_CLOUD_ENDPOINT || 'mitre/mitre-builder' }}

      # The default path. Free for public repositories, and proven: five
      # consecutive mainline builds of this target completed in 62m13s-64m10s
      # and each pushed a working amd64+arm64 image. It is slow because the
      # image compiles Ruby, jemalloc and YJIT from source and both platform
      # legs share one 4-vCPU runner - a budgeting problem, not a correctness
      # problem, and the budget above is sized for it.
      - name: Set up QEMU (emulated multi-arch)
        if: inputs.builder == 'emulated'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx (local + QEMU emulation)
        if: inputs.builder == 'emulated'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build and push the multi-arch image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          TAG_SUFFIXES: ${{ inputs.tag_suffixes }}
        with:
          files: docker-bake.hcl
          targets: registry
          push: true

      - name: SBOM scan and dependency submission
        if: inputs.submit_sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: mitre/vulcan:${{ inputs.version }}
          artifact-name: image.spdx.json
          dependency-snapshot: true

      # ─── IRON BANK ───
      # Vulcan on Iron Bank ships both an arm64 and an amd64 image, so the
      # hardening manifest needs the per-architecture digests of the manifest
      # list we just pushed, not the list digest.
      - name: Resolve per-architecture image digests for the Iron Bank manifest
        id: digests
        shell: bash
        env:
          TAG: mitre/vulcan:${{ inputs.version }}
        run: |
          set -euo pipefail
          # DockerHub's registry read path can lag the push by a few seconds, so
          # a single inspect occasionally sees no manifest and the whole publish
          # fails after the image is already live. Retry before giving up.
          for arch in amd64 arm64; do
            digest=""
            for attempt in 1 2 3 4 5; do
              digest="$(docker buildx imagetools inspect "$TAG" --format \
                "{{range .Manifest.Manifests}}{{if and (eq .Platform.OS \"linux\") (eq .Platform.Architecture \"$arch\")}}{{.Digest}}{{end}}{{end}}" \
                2>/dev/null || true)"
              [[ "$digest" == sha256:* ]] && break
              echo "linux/$arch digest not available yet (attempt $attempt/5); retrying in 5s"
              sleep 5
            done
            if [[ "$digest" != sha256:* ]]; then
              echo "::error::Failed to resolve the linux/$arch digest for $TAG after 5 attempts"
              exit 1
            fi
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
            echo "Resolved linux/$arch = $digest"
          done

      - name: Open the Iron Bank merge request
        uses: mitre/ironbank_release_action@1c14c27db1c37e894f8042ac2edcde08d445882d # v1
        with:
          name: Vulcan
          version: ${{ inputs.version }}
          ironbank_pat: ${{ secrets.SAF_IRONBANK_REPO1_PAT }}
          ironbank_username: ${{ secrets.SAF_IRONBANK_REPO1_USERNAME }}
          ironbank_project_id: ${{ inputs.ironbank_project_id }}
          ironbank_project_clone_url: ${{ inputs.ironbank_clone_url }}
          git_commit_author_name: ${{ inputs.ironbank_commit_author_name }}
          git_commit_author_email: "saf@mitre.org"
          # Each `sed` is paired with a `grep -qxF` assertion on the value it was
          # supposed to write. `sed` exits 0 when its pattern matches nothing, so
          # without the assertion a missing or reshaped `ARG VULCAN_VERSION=` line in
          # repo1 would silently leave a stale version argument in the built image.
          update_commands: |
            yq e -i '.tags[0]=\"${{ inputs.version }}\" | .labels.\"org.opencontainers.image.version\"=\"${{ inputs.version }}\" | .resources[0].tag=\"mitre/vulcan:${{ inputs.version }}\" | .resources[0].url=\"docker://docker.io/mitre/vulcan@${{ steps.digests.outputs.amd64 }}\" | .resources[1].tag=\"mitre/vulcan:${{ inputs.version }}.arm64\" | .resources[1].url=\"docker://docker.io/mitre/vulcan@${{ steps.digests.outputs.arm64 }}\"' hardening_manifest.yaml
            sed -i 's/^ARG VULCAN_VERSION=.*/ARG VULCAN_VERSION=${{ inputs.version }}/' Dockerfile
            grep -qxF 'ARG VULCAN_VERSION=${{ inputs.version }}' Dockerfile || { echo 'Iron Bank update failed: Dockerfile has no line ARG VULCAN_VERSION=${{ inputs.version }} after sed'; exit 1; }
            sed -i 's/^ARG VULCAN_VERSION=.*/ARG VULCAN_VERSION=${{ inputs.version }}.arm64/' Dockerfile.arm64
            grep -qxF 'ARG VULCAN_VERSION=${{ inputs.version }}.arm64' Dockerfile.arm64 || { echo 'Iron Bank update failed: Dockerfile.arm64 has no line ARG VULCAN_VERSION=${{ inputs.version }}.arm64 after sed'; exit 1; }

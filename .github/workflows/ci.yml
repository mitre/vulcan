name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dependabot.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dependabot.yml'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── LINT + SECURITY ─────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    # Higher than the usual 10 to absorb a cold Ruby-from-source compile on the
    # first run after a version bump; cached runs are back to normal.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      # TEMPORARY: source-build Ruby because ruby-builder has no prebuilt binary
      # for the pinned version yet. Revert to ruby/setup-ruby once it does.
      - uses: ./.github/actions/setup-ruby-source
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: RuboCop
        run: bundle exec rubocop --parallel
      - name: ESLint
        run: yarn lint:ci
      - name: Brakeman
        run: bundle exec brakeman -q --no-pager
      - name: Bundle Audit
        run: bundle exec bundler-audit check --update

  # ─── FRONTEND TESTS + COVERAGE ───────────────────────────
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Vitest with coverage
        run: yarn test:unit --coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-frontend
          path: coverage/js
          retention-days: 5

  # ─── BACKEND TESTS + COVERAGE (6 shards) ─────────────────
  backend:
    runs-on: ubuntu-24.04
    # Higher than the usual 25 to absorb a cold Ruby-from-source compile on the
    # first run after a version bump; cached runs are back to normal.
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        ci_node_index: [1, 2, 3, 4, 5, 6]

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: vulcan_vue_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--nosync"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 500ms
          --health-timeout 3s
          --health-retries 20
      ldap:
        image: rroemhild/test-openldap
        ports:
          - 10389:10389

    env:
      # Application config (read by database.yml)
      DATABASE_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # libpq vars (read by pg_isready, psql CLI tools)
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_ENV: test
      RUBY_YJIT_ENABLE: "1"
      CI: "true"
      # OIDC Testing — VULCAN_OIDC_* is the primary source;
      # spec/support/okta_test_config.rb falls back to these
      VULCAN_ENABLE_OIDC: "true"
      VULCAN_OIDC_DISCOVERY: "true"
      VULCAN_OIDC_ISSUER_URL: ${{ secrets.OKTA_TEST_ISSUER }}
      VULCAN_OIDC_CLIENT_ID: ${{ secrets.OKTA_TEST_CLIENT_ID }}
      VULCAN_OIDC_CLIENT_SECRET: ${{ secrets.OKTA_TEST_CLIENT_SECRET }}
      # LDAP Testing (rroemhild/test-openldap public defaults)
      VULCAN_ENABLE_LDAP: "true"
      VULCAN_LDAP_HOST: localhost
      VULCAN_LDAP_ATTRIBUTE: mail
      VULCAN_LDAP_BIND_DN: "cn=admin,dc=planetexpress,dc=com"
      VULCAN_LDAP_BASE: "ou=people,dc=planetexpress,dc=com"
      VULCAN_LDAP_PORT: "10389"
      VULCAN_LDAP_ADMIN_PASS: GoodNewsEveryone

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      # TEMPORARY: source-build Ruby because ruby-builder has no prebuilt binary
      # for the pinned version yet. Revert to ruby/setup-ruby once it does.
      # (This action also installs libpq-dev and the gem bundle.)
      - uses: ./.github/actions/setup-ruby-source
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile

      - name: Cache JS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: js-cache
        with:
          path: app/assets/builds
          key: js-build-${{ hashFiles('app/javascript/**', 'yarn.lock', 'esbuild.config.js', 'package.json') }}
      - name: Build JavaScript assets
        if: steps.js-cache.outputs.cache-hit != 'true'
        run: yarn build

      # The docs serving specs read real files from the built documentation
      # site — a runner without one errors on every docs example, and a suite
      # that is green only when a stale dist happens to sit on a developer's
      # disk is not evidence. Same cache pattern as the JS build; the key
      # covers the documentation sources, the target table, and the OpenAPI
      # sources the bundled specification is generated from.
      - name: Cache documentation site build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: docs-cache
        with:
          path: docs/.vitepress/dist
          key: docs-build-${{ hashFiles('docs/**/*.md', 'docs/.vitepress/**', 'docs/package.json', 'docs/yarn.lock', 'doc/openapi/**') }}
      - name: Build documentation site
        if: steps.docs-cache.outputs.cache-hit != 'true'
        run: bundle exec rails docs:build

      - name: Setup database
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run backend tests (shard ${{ matrix.ci_node_index }}/6)
        run: |
          bundle exec parallel_rspec \
            -n 6 \
            --only-group ${{ matrix.ci_node_index }} \
            spec/

      - name: Upload backend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-shard-${{ matrix.ci_node_index }}
          path: coverage
          retention-days: 5

  # ─── SEED PIPELINE (standalone — truncation strategy, must not shard) ───
  seed-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: vulcan_vue_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--nosync"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 500ms
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_ENV: test
      RUBY_YJIT_ENABLE: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      # TEMPORARY: source-build Ruby because ruby-builder has no prebuilt binary
      # for the pinned version yet. Revert to ruby/setup-ruby once it does.
      - uses: ./.github/actions/setup-ruby-source
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile

      # rails_helper aborts every spec run unless app/assets/builds has
      # compiled JS (builds are gitignored) — same cache key as the backend
      # shards, so this is normally an instant cache hit.
      - name: Cache JS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: js-cache
        with:
          path: app/assets/builds
          key: js-build-${{ hashFiles('app/javascript/**', 'yarn.lock', 'esbuild.config.js', 'package.json') }}
      - name: Build JavaScript assets
        if: steps.js-cache.outputs.cache-hit != 'true'
        run: yarn build

      - name: Setup database
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      # Runs the full seed pipeline into a clean database and verifies seed
      # truth + idempotency. Deliberately NOT part of the sharded backend
      # matrix: the spec's truncation strategy corrupts parallel test DBs.
      - name: Run seed pipeline spec
        run: bundle exec rspec spec/seeds/seed_pipeline_spec.rb --tag seed_pipeline

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE_NAME: mitre/vulcan:ci-${{ github.sha }}
      COMPOSE_PROJECT_NAME: vulcan-ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3

      - name: Build production image with Bake
        run: >-
          docker buildx bake
          --file docker-bake.hcl
          --set "*.cache-from=type=gha"
          --set "*.cache-to=type=gha,mode=max"
          --set "*.output=type=docker"
          --set "*.platform=linux/amd64"
          --set "*.tags=${IMAGE_NAME}"
          ci

      - name: Save Docker image tarball
        run: docker save --output vulcan-image.tar "$IMAGE_NAME"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulcan-docker-image
          path: vulcan-image.tar
          retention-days: 5

      - name: Create CI environment files
        run: |
          cat <<EOF > .env
          VULCAN_DB_HOST=db
          VULCAN_DB_PORT=5432
          VULCAN_DB_NAME=vulcan_production
          VULCAN_DB_USER=postgres
          VULCAN_DB_PASSWORD=postgres
          POSTGRES_DB=vulcan_production
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          SECRET_KEY_BASE=ci-secret-key-base-for-compose-healthcheck
          VULCAN_ENABLE_OIDC=false
          VULCAN_ENABLE_LDAP=false
          IMAGE_NAME=${IMAGE_NAME}
          EOF
          cp .env .env.ci

      - name: Start Docker Compose stack
        run: |
          docker compose up -d --no-build

      - name: Wait for Vulcan to become healthy
        run: |
          container_id="$(docker compose ps -q web)"
          if [ -z "$container_id" ]; then
            echo "::error::Web container was not created"
            docker compose ps
            exit 1
          fi

          for _ in $(seq 1 60); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              echo "Vulcan is healthy"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "::error::Vulcan became unhealthy"
              docker compose logs --no-color
              exit 1
            fi
            sleep 5
          done

          echo "::error::Timed out waiting for Vulcan to become healthy"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v

  # ─── GATE — single required status check for branch protection ───
  ci-gate:
    needs: [lint, frontend, backend, seed-pipeline, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "::error::One or more CI jobs failed, were cancelled, or were skipped"
            exit 1
          fi
          echo "All CI jobs passed"

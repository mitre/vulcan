name: Mainline

# Bleeding-edge counterpart to release.yml: pushes mitre/vulcan:<git-sha> and
# :latest, and opens an Iron Bank merge request against the vulcan-mainline
# repo1 project. Both share .github/workflows/docker-publish.yml.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dependabot.yml'
  workflow_dispatch:
    inputs:
      builder:
        description: 'Build driver. emulated is free (~65 min); cloud is ~3 min but spends the org shared Build Cloud minutes.'
        required: false
        default: emulated
        type: choice
        options:
          - emulated
          - cloud

concurrency:
  group: mainline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ github.sha }}
      tag_suffixes: "${{ github.sha }},latest"
      # Never `cloud` on the automatic trigger: this runs on every push to
      # master and the Build Cloud minutes are an org-wide shared pot. Dispatch
      # with builder=cloud when a mainline image is needed in a hurry.
      builder: ${{ inputs.builder || 'emulated' }}
      version: ${{ github.sha }}
      ironbank_project_id: 19019
      ironbank_clone_url: repo1.dso.mil/dsop/mitre/security-automation-framework/vulcan-mainline.git
      ironbank_commit_author_name: "Automated Vulcan Mainline"
    secrets: inherit

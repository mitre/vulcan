name: Mainline

# Tracks every push to the default branch: builds and pushes a bleeding-edge
# multi-arch image tagged mitre/vulcan:<git-sha> and :latest, then opens an Iron
# Bank merge request against the vulcan-mainline repo1 project. Mirrors
# release.yml, which publishes the stable mitre/vulcan:<version> +
# :release-latest. Both share .github/workflows/docker-publish.yml.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dependabot.yml'
  workflow_dispatch:
    inputs:
      builder:
        description: 'Build driver. emulated is free (~65 min); cloud is ~3 min but spends the org shared Build Cloud minutes.'
        required: false
        default: emulated
        type: choice
        options:
          - emulated
          - cloud

concurrency:
  group: mainline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ github.sha }}
      tag_suffixes: "${{ github.sha }},latest"
      # The free emulated driver, always, on the automatic trigger. Mainline
      # runs on every push to master, so it must never draw on the
      # organisation's shared Build Cloud pot. It is proven here: the last five
      # mainline builds took 62-64 minutes and each pushed a working
      # amd64+arm64 image. The concurrency group above cancels superseded
      # pushes so hour-long builds do not queue up behind each other. A human
      # can still dispatch with builder=cloud when a mainline image is needed
      # in a hurry.
      #
      # OPEN QUESTION for the maintainers: an hour of runner time per master
      # push is a lot for a bleeding-edge tag. Moving this to a daily
      # `schedule:` (plus this manual dispatch) would cut it by roughly 90%
      # and keep both the multi-arch `latest` image and the repo1 mainline
      # feed intact, at the cost of `<git-sha>` images existing only for the
      # commits that happen to be HEAD when it runs. That changes a published
      # artifact contract, so it is left as a deliberate decision rather than
      # folded into a release fix. See docs/site/development/release-process.md.
      builder: ${{ inputs.builder || 'emulated' }}
      version: ${{ github.sha }}
      ironbank_project_id: 19019
      ironbank_clone_url: repo1.dso.mil/dsop/mitre/security-automation-framework/vulcan-mainline.git
      ironbank_commit_author_name: "Automated Vulcan Mainline"
    secrets: inherit
